spring:
  profiles:
    default: local
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 0

langchain4j:
  open-ai:
    api-key: "sk-9864ee2e574873b4c1c728dcd0cee86dc97d1603e3854235ce0bdc66f48e379a"
    model-name: gpt-5.6-terra
    base-url: http://ap-southeast-1-7x82o.gptdy.17usoft.com
    temperature: 0
    timeout: 30000

milvus:
  host: localhost
  port: 19530
  collection-name: data_agent_vectors
  index-type: IVF_FLAT

app:
  embedding:
    dimension: 1024
    index-version: bge-m3-v1
    normalize: true
    metric: COSINE
    api:
      base-url: https://api.siliconflow.cn/v1
      api-key: "sk-wwokpnbclbfyifeaouihjuakunwjhdjzhvpyyalvvztvjkdm"
      model-name: BAAI/bge-m3
      timeout: 30s
      output-dimensions: ""
      batch-size: 32
      max-attempts: 3
      initial-backoff: 200ms
      circuit-failure-threshold: 5
      circuit-open-duration: 30s
      query-prefix: ""
      document-prefix: ""
  cors:
    allowed-origins: ""
  encryption:
    key: ""
  rate-limit:
    requests-per-minute: 20
  token-quota:
    daily-limit-per-user: 1000000
  security:
    bootstrap-admin-users: super
    registration:
      enabled: false
      tenant-id: default
  file-processing:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
  knowledge-vector:
    core-pool-size: 1
    max-pool-size: 2
    queue-capacity: 100
  sse:
    timeout-ms: 600000
    core-pool-size: 2
    max-pool-size: 8
    queue-capacity: 100
  agent:
    runtime:
      # 保护性默认值，后续应依据执行轨迹的 P95/P99 分布调优。
      timeout: 5m
      max-iterations: 8
      max-model-calls: 24
      max-tool-calls: 32
      max-tokens: 100000
    context:
      # 模型目录尚未维护统一窗口元数据时使用保守默认值；可按项目模型 ID 覆盖。
      default-model-window-tokens: 32768
      reserved-output-tokens: 4096
      safety-margin-tokens: 1024
      protected-recent-messages: 4
      model-window-overrides: {}
      compaction:
        # 默认只检查并明确拒绝超限请求；未评测前不静默裁剪或调用摘要模型。
        enabled: false
        model-summary-enabled: false
    durable:
      # 是否启用持久化审批及沙箱工具由各环境 Profile 显式决定。
      approval-ttl: 24h
      lease-duration: 60s
      scan-interval: PT15S
      terminal-retention: 30d
      scan-batch-size: 50
      max-resume-attempts: 3
      # 恢复执行不能占用调度线程，否则同一调度器无法按时续租。
      resume-core-pool-size: 2
      resume-max-pool-size: 4
      resume-queue-capacity: 100
    tool-governance:
      # 工具代码声明安全属性；这里仅提供环境级启用集合与统一保护上限。
      max-argument-length: 16384
      max-result-length: 20000
      default-timeout: 20s
      max-attempts: 2
      initial-backoff: 100ms
      max-backoff: 1s
      journal-capacity: 64
      max-risk: HIGH
      enabled-tools: []
      core-pool-size: 2
      max-pool-size: 8
      queue-capacity: 100
    reasoning:
      # 自主模式：true 绕过分类/快路/规划/预检，直接进 ReAct 循环，决策权全交模型。
      # 默认开启（模型优先）；设为 false 切回编排式用于对比
      autonomous-mode: true
      fast-path-enabled: true
      planning-enabled: true
      parallel-precheck-enabled: true
      reflection-enabled: true
      working-memory-enabled: true
  rag:
    enabled: true
    top-k: 6
    candidate-top-k: 20
    min-score: 0.25
    max-context-chars: 5000
    reranker:
      enabled: true
      base-url: https://api.siliconflow.cn/v1/rerank
      api-key: "sk-wwokpnbclbfyifeaouihjuakunwjhdjzhvpyyalvvztvjkdm"
      model-name: BAAI/bge-reranker-v2-m3
      timeout: 5s
      max-candidates: 20
      max-document-chars: 4000
      fail-open: true
      max-attempts: 2
      initial-backoff: 200ms
      circuit-failure-threshold: 5
      circuit-open-duration: 30s
    health:
      es-latency-threshold-ms: 100
      milvus-latency-threshold-ms: 50
      rag-latency-threshold-ms: 2000
    benchmark:
      dataset-path: ./config/rag-golden-dataset.json
      minimum-cases: 30
      maximum-cases: 200
    elasticsearch:
      base-url: http://localhost:9200
      index-name: data-agent-rag-v2
      username: ""
      password: ""
      connect-timeout: 2s
      request-timeout: 5s
  memory:
    model-compression-enabled: false
    semantic-extraction-enabled: true
    semantic-extraction-min-confidence: 0.85
    retention-batch-size: 200
    short-term-retention-days: 30
    max-memories-per-user: 500
    retention-cron: "0 15 3 * * *"
    decay-cron: "0 0 3 * * *"
    promotion-access-count-threshold: 3
    promotion-decay-weight-threshold: 0.8
    short-term-delete-threshold: 0.1
    long-term-decay-after-days: 90
    short-term-decay-rate: 0.95
    long-term-decay-rate: 0.99
jwt:
  secret: ""
  access-token-validity-ms: 7200000
  refresh-token-validity-ms: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: data-agent

logging:
  level:
    com.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
