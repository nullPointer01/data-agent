spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: data_agent
    password: data_agent_local
    virtual-host: /data-agent
  datasource:
    url: jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: zym190457
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      repositories:
        enabled: false

langchain4j:
  open-ai:
    api-key: local-development-placeholder-key
    model-name: qwen-plus
    base-url: https://api.openai.com/v1

app:
  embedding:
    # 本机 Ollama 原生运行；复用 LangChain4j OpenAI-compatible 客户端。
    # 独立版本隔离云端旧向量，历史知识/文件/长期记忆需从原文重建索引。
    dimension: 1024
    index-version: ollama-bge-m3-v1
    api:
      base-url: http://localhost:11434/v1
      api-key: ollama
      model-name: bge-m3:latest
      # 冷启动需要加载本地模型，批量规模先按本机保守配置。
      timeout: 120s
      batch-size: 8
      output-dimensions: ""
      query-prefix: ""
      document-prefix: ""
  rag:
    reranker:
      # Ollama Embedding 不提供 Cross-Encoder 精排；本地使用现有规则排序。
      # 避免继续请求已欠费的云端 Rerank；prod 仍保留云端精排。
      enabled: false
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  encryption:
    key: local-development-encryption-key-32chars
  agent:
    orchestration:
      # 学习对照：改成 TOOL_CALLING 并重启，可比较原路径；不影响 CHAT / REACT。
      engine: SUPERVISOR
    planning:
      # 复用本地模型管理中已启用的 GPT；这是 model_config.model_id，不是厂商模型名。
      # 地址、密钥和参数仍由原模型记录管理；切换回答模型不会改变此规划绑定。
      model-id: "6fac3eb2-aea9-4bc7-a61a-ee65e3290e3c"
    context:
      # 与公共配置一致：超限才生成有原文证据的任务摘要。
      compaction:
        enabled: true
        model-summary-enabled: true
    durable:
      # 本地只开放隔离沙箱写工具，便于直接验收审批与恢复链路。
      enabled: true
      sandbox-tool-enabled: true
      enabled-approval-tools: updateHotelPrice
  security:
    registration:
      enabled: true
      tenant-id: default
    outbound:
      # 本地开发允许连接受信任的私网模型端点；生产环境保持默认 false
      allow-private-network: true

jwt:
  secret: local-development-jwt-secret-at-least-32-chars

logging:
  level:
    com.ai: DEBUG
