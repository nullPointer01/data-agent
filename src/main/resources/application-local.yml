spring:
  datasource:
    url: jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: zym190457
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      repositories:
        enabled: false

langchain4j:
  open-ai:
    api-key: local-development-placeholder-key
    model-name: qwen-plus
    base-url: https://api.openai.com/v1

app:
  embedding:
    dimension: 1024
    index-version: bge-m3-v1
    api:
      base-url: https://api.siliconflow.cn/v1
      model-name: BAAI/bge-m3
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  encryption:
    key: local-development-encryption-key-32chars
  agent:
    orchestration:
      # 学习对照：改成 TOOL_CALLING 并重启，可比较原路径；不影响 CHAT / REACT。
      engine: SUPERVISOR
    planning:
      # 复用本地模型管理中已启用的 GPT；这是 model_config.model_id，不是厂商模型名。
      # 地址、密钥和参数仍由原模型记录管理；切换回答模型不会改变此规划绑定。
      model-id: "6fac3eb2-aea9-4bc7-a61a-ee65e3290e3c"
    context:
      # 按预算裁剪完整历史轮次，不额外调用模型生成摘要。
      compaction:
        enabled: true
        model-summary-enabled: false
    durable:
      # 本地只开放隔离沙箱写工具，便于直接验收审批与恢复链路。
      enabled: true
      sandbox-tool-enabled: true
      enabled-approval-tools: updateHotelPrice
  security:
    registration:
      enabled: true
      tenant-id: default
    outbound:
      # 本地开发允许连接受信任的私网模型端点；生产环境保持默认 false
      allow-private-network: true

jwt:
  secret: local-development-jwt-secret-at-least-32-chars

logging:
  level:
    com.ai: DEBUG
