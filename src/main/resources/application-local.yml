spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:zym190457}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      repositories:
        enabled: false

langchain4j:
  open-ai:
    api-key: local-development-placeholder-key
    model-name: qwen-plus
    base-url: https://api.openai.com/v1

app:
  embedding:
    dimension: ${EMBEDDING_DIMENSION:1024}
    index-version: ${EMBEDDING_INDEX_VERSION:bge-m3-v1}
    api:
      base-url: ${EMBEDDING_API_BASE_URL:https://api.siliconflow.cn/v1}
      model-name: ${EMBEDDING_MODEL_NAME:BAAI/bge-m3}
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  encryption:
    key: local-development-encryption-key-32chars
  security:
    outbound:
      # 本地开发允许连接受信任的私网模型端点；生产环境保持默认 false
      allow-private-network: true

jwt:
  secret: local-development-jwt-secret-at-least-32-chars

logging:
  level:
    com.ai: DEBUG
