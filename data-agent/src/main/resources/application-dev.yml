spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

langchain4j:
  open-ai:
    api-key: ${LANGCHAIN_API_KEY:}
    model-name: ${LANGCHAIN_MODEL_NAME:qwen-plus}
    base-url: ${LANGCHAIN_BASE_URL:https://api.openai.com/v1}
    temperature: 0.7
    timeout: 30000

jwt:
  secret: ${JWT_SECRET:}
  access-token-validity-ms: 7200000
  refresh-token-validity-ms: 604800000

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:20}
  token-quota:
    daily-limit-per-user: ${TOKEN_QUOTA_DAILY:1000000}
  security:
    bootstrap-admin-users: ${BOOTSTRAP_ADMIN_USERS:super}
  file-processing:
    core-pool-size: ${FILE_PROCESSING_CORE_POOL_SIZE:2}
    max-pool-size: ${FILE_PROCESSING_MAX_POOL_SIZE:4}
    queue-capacity: ${FILE_PROCESSING_QUEUE_CAPACITY:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: data-agent

logging:
  level:
    com.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
